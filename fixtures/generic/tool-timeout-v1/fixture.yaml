schema_version: "0.1"
id: tool-timeout-v1
family: generic
reset:
  strategy: script
  command: "reset scripted tool responses"
environment:
  network: disabled
tools:
  - name: search_record
    description: "指定したIDのレコードを取得する。"
    input_schema:
      type: object
      required: [id]
      properties:
        id:
          type: string
    scripted_responses:
      - error:
          type: timeout
          retryable: true
      - result:
          id: target-record
          value: expected data
notes: "Phase 1 review fixture. The runner implementation is intentionally deferred."
