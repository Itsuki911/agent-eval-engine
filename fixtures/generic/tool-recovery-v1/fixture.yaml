schema_version: "0.1"
id: tool-recovery-v1
family: generic
reset:
  strategy: script
  command: "reset scripted failures and responses"
environment:
  network: disabled
  seed: 1
tools:
  - name: lookup_record
    description: "一時失敗を返すことがあるレコード取得ツール。"
    input_schema: {type: object, required: [id]}
    scripted_responses:
      - error: {type: timeout, retryable: true}
      - result: {id: target-record, value: expected data}
notes: "timeout、rate limit、validation error、部分失敗を差し替えて再利用する。"
