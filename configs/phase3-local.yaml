engine:
  agent_name: phase3-evaluator
  dry_run: true
  max_steps: 12
model:
  provider: openrouter
  model: qwen/qwen3.8-27b:free
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  timeout_seconds: 60
  max_retries: 1
  temperature: 0
telemetry:
  service_name: agent-eval-engine
  exporter: console
