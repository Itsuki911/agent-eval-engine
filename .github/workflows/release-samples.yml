name: Release samples

on:
  push:
    tags:
      - 'samples-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: sample ZIPを作成
        run: PYTHONPATH=packages/core python scripts/build_sample_package.py --output dist/phase1-samples-v1.zip
      - name: SHA-256を出力
        run: sha256sum dist/phase1-samples-v1.zip > dist/phase1-samples-v1.zip.sha256
      - name: GitHub Releasesへ公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/phase1-samples-v1.zip dist/phase1-samples-v1.zip.sha256 --generate-notes
