name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_eval_test
          POSTGRES_USER: agent_eval
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_eval -d agent_eval_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://agent_eval:test-password@localhost:5432/agent_eval_test
      TEST_DATABASE_URL: postgresql+psycopg://agent_eval:test-password@localhost:5432/agent_eval_test
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python依存関係を導入
        run: pip install -r requirements-engine.txt -r requirements-ci.txt
      - name: Python形式と静的検査を実行
        run: |
          ruff check packages/core/agent_eval database scripts
          mypy
      - name: Python依存関係を検査
        run: pip-audit -r requirements-engine.txt
      - name: DBを最新版へ更新
        run: alembic upgrade head
      - name: Pythonテストを実行
        run: pytest -q -m "not live"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Go形式を検査
        working-directory: apps/cli
        run: test -z "$(gofmt -l .)"
      - name: Goテストを実行
        working-directory: apps/cli
        run: go test ./...

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 秘密情報を検査
        uses: gitleaks/gitleaks-action@v2
