name: Release MCPB

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: MCPBを作成
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          powershell -ExecutionPolicy Bypass -File .\scripts\build_mcpb.ps1 -Version $version
      - name: SHA-256を作成
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\dist\agent-eval-engine.mcpb).Hash.ToLower()
          "$hash  agent-eval-engine.mcpb" | Set-Content -NoNewline .\dist\agent-eval-engine.mcpb.sha256
      - name: GitHub Releaseへ公開
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" .\dist\agent-eval-engine.mcpb .\dist\agent-eval-engine.mcpb.sha256 --generate-notes --title "Agent Eval Engine ${{ github.ref_name }}"
