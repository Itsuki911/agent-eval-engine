name: 機能リクエスト (Feature Request)
description: 新しい機能や改善の提案
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Agent Eval Engine の機能向上に関するご提案をお待ちしています。
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題や背景
      description: 現在のどのような点に不便を感じているか、どのような状況で必要となるかを教えてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能や変更内容
      description: どのような機能やコマンド、UI の改善を希望されるかを具体的に記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案 (任意)
      description: 他に検討された手段や回避策があれば記載してください。
