
services:
  # 開発用PostgreSQL
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_eval}
      POSTGRES_USER: ${POSTGRES_USER:-agent_eval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro

  # DB操作用Python
  db-tools:
    profiles: ["db"]
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent_eval}:${POSTGRES_PASSWORD:-local-development-password}@db:5432/${POSTGRES_DB:-agent_eval}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent_eval}:${POSTGRES_PASSWORD:-local-development-password}@db:5432/agent_eval_test
      PYTHONPATH: /workspace:/workspace/packages/core
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/workspace
    command: ["pytest", "-q", "tests/integration/test_postgresql_persistence.py"]

  # 評価エンジン実行用Python
  engine:
    profiles: ["engine"]
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent_eval}:${POSTGRES_PASSWORD:-local-development-password}@db:5432/${POSTGRES_DB:-agent_eval}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent_eval}:${POSTGRES_PASSWORD:-local-development-password}@db:5432/agent_eval_test
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-replace-with-your-openrouter-api-key}
      PYTHONPATH: /workspace:/workspace/packages/core
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/workspace

  # Go CLI/TUIモック用
  cli:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: docker/Dockerfile.cli
    working_dir: /workspace/apps/cli
    environment:
      AGENT_EVAL_BACKEND: "0"
    stdin_open: true
    tty: true
    volumes:
      - ./:/workspace

  # Python統合TUI用
  tui:
    profiles: ["tui"]
    build:
      context: .
      dockerfile: docker/Dockerfile.tui
    working_dir: /workspace
    environment:
      AGENT_EVAL_BACKEND: "1"
      AGENT_EVAL_ROOT: /workspace
      AGENT_EVAL_PYTHON: python
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent_eval}:${POSTGRES_PASSWORD:-local-development-password}@db:5432/${POSTGRES_DB:-agent_eval}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-replace-with-your-openrouter-api-key}
      AGENT_EVAL_DOWNLOAD_DIR: /exports
      AGENT_EVAL_DOWNLOAD_DISPLAY_DIR: ${AGENT_EVAL_HOST_DOWNLOAD_DIR:-./exports}
      AGENT_EVAL_DATA_DIR: /local-data
      PYTHONPATH: /workspace:/workspace/packages/core
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
    volumes:
      - ./:/workspace
      # CSVをホスト側へ保存する
      - ${AGENT_EVAL_HOST_DOWNLOAD_DIR:-./exports}:/exports
      # 自作datasetをホストへ保存する
      - ${AGENT_EVAL_HOST_DATA_DIR:-./local-data}:/local-data

  evaluator:
    build:
      context: .
      dockerfile: docker/Dockerfile.evaluator
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
    command: ["--check-fixtures"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
