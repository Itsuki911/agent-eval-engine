[package]
name = "agent-eval-rust"
version = "0.1.0"
edition = "2021"
description = "High-performance YAML parser and benchmark streaming core for Agent Eval Engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
