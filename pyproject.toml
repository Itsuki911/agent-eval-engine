[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "I001", "UP", "F821"]

[tool.mypy]
python_version = "3.12"
files = ["packages/core/agent_eval", "database", "scripts"]
exclude = ["database/migrations/versions"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
